# ============================================================================
# CATEGORY 5: FORMAT COMPLIANCE (8 cases)
# Tests array args, optional params, enum values, nested/complex schemas.
# ============================================================================

- id: fmt_email_no_cc
  category: format_compliance
  split: dev
  prompt: "Email alice@example.com with subject 'Ping' and body 'Just checking in.'"
  expected_tools:
    - name: send_email
      args:
        to: alice@example.com
        subject: "Ping"
        body: "Just checking in."

- id: fmt_email_three_cc
  category: format_compliance
  split: dev
  prompt: "Send an email to lead@example.com, cc team1@example.com, team2@example.com, and team3@example.com, subject 'Release', body 'Ship it.'"
  expected_tools:
    - name: send_email
      args:
        to: lead@example.com
        cc: ["team1@example.com", "team2@example.com", "team3@example.com"]
        subject: "Release"
        body: "Ship it."

- id: fmt_event_four_attendees
  category: format_compliance
  split: dev
  prompt: "Create an event 'All-hands' from 2026-04-22T13:00:00 to 2026-04-22T14:00:00 with attendees a@x.com, b@x.com, c@x.com, and d@x.com."
  expected_tools:
    - name: create_calendar_event
      args:
        title: "All-hands"
        start: "2026-04-22T13:00:00"
        end: "2026-04-22T14:00:00"
        attendees: ["a@x.com", "b@x.com", "c@x.com", "d@x.com"]

- id: fmt_weather_fahrenheit_enum
  category: format_compliance
  split: dev
  prompt: "Give me the weather in Phoenix, Arizona in Fahrenheit."
  expected_tools:
    - name: get_weather
      args:
        location: "Phoenix, AZ"
        units: "fahrenheit"

- id: fmt_weather_no_units
  category: format_compliance
  split: holdout
  prompt: "Weather in Boston?"
  expected_tools:
    - name: get_weather
      args:
        location: "Boston, MA"

- id: fmt_currency_decimal_amount
  category: format_compliance
  split: holdout
  prompt: "Convert 49.99 USD to CAD."
  expected_tools:
    - name: convert_currency
      args:
        amount: 49.99
        from: USD
        to: CAD

- id: fmt_event_no_attendees
  category: format_compliance
  split: holdout
  prompt: "Create an event 'Focus block' from 2026-04-16T09:00:00 to 2026-04-16T11:00:00."
  expected_tools:
    - name: create_calendar_event
      args:
        title: "Focus block"
        start: "2026-04-16T09:00:00"
        end: "2026-04-16T11:00:00"

- id: fmt_calendar_read_single_day
  category: format_compliance
  split: holdout
  prompt: "Show me today's events — start and end date both 2026-04-14."
  expected_tools:
    - name: get_calendar_events
      args:
        start_date: "2026-04-14"
        end_date: "2026-04-14"
